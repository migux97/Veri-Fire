name: Solana

on:
  push:
    branches: [main, dev, solana-migration]
  pull_request:

jobs:
  program:
    name: Programa Anchor (tests nativos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana
      - run: cargo test --manifest-path solana/Cargo.toml

  app:
    name: Tests de la app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - run: npm test
