[package]
name = "verifire_product"
version = "0.1.0"
description = "Certificados de autenticidad y garantía de VeriFire en Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "verifire_product"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"

[dev-dependencies]
solana-program-test = { version = "~4.2", features = ["agave-unstable-api"] }
solana-ed25519-program = "3.0.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "~4.1.4"
solana-account = "~4.3.1"
solana-clock = "3.0.1"
sysvar_v3 = { package = "solana-sysvar", version = "3.1.1" }
sysvar_v4 = { package = "solana-sysvar", version = "~4.1" }
solana-instruction = "~3.4"
solana-account-info = "~3.1"
solana-program-error = "~3.0"
solana-pubkey = "~3.0"
ed25519-dalek = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bincode = "1"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
