[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Solo cambia el comportamiento fuera de SBF: ver test-support/solana-invoke/src/lib.rs.
[patch.crates-io]
solana-invoke = { path = "test-support/solana-invoke" }
